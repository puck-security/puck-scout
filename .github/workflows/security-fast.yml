# security-fast.yml — every push to main + every PR.
#
# Tools, all installed via their native package manager with pinned
# versions (smaller supply-chain surface than third-party actions):
#   gitleaks      — secret detection (every commit in history)
#   actionlint    — workflow YAML security/correctness
#   semgrep       — SAST (OSS rules only, no token, no Docker image)
#   govulncheck   — known-CVE vulns in Go deps + call-graph reachability
#
# cargo-audit is already in rust.yml — left there so Rust-only PRs
# don't pay the cost of installing Go tooling.
#
# Every `uses:` is pinned to a commit SHA (NOT a tag).  Tags are
# mutable; a compromised maintainer can retag without changing the
# version number.  SHA pinning makes a re-pin a visible diff.
name: security-fast

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel older runs of the same workflow on the same branch — saves CI
# minutes when PRs are force-pushed.
concurrency:
  group: security-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
        with:
          fetch-depth: 0   # gitleaks scans full history; shallow clone misses old leaks
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32  # v5.0.2
        with:
          go-version: '1.22'
      - name: Install gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.18.4
      - name: Scan
        run: gitleaks detect --redact --no-banner --exit-code 1

  actionlint:
    name: actionlint (workflow security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32  # v5.0.2
        with:
          go-version: '1.22'
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.4
      - name: Lint workflows
        run: actionlint -color

  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    # The OSS rule packs we pull (p/security-audit, p/golang, p/rust)
    # are curated and signed by Semgrep — no third-party action, no
    # SEMGREP_APP_TOKEN, no Docker image.
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
      - uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f  # v5.1.1
        with:
          python-version: '3.12'
      - name: Install semgrep
        run: pip install semgrep==1.85.0
      - name: Scan
        # --error: non-zero exit on findings (gate the merge)
        # --metrics=off: don't phone home with usage stats
        run: |
          semgrep \
            --config=p/security-audit \
            --config=p/golang \
            --config=p/rust \
            --error \
            --metrics=off \
            --timeout=120

  govulncheck:
    name: govulncheck (Go vulns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32  # v5.0.2
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.3
      - name: Scan
        working-directory: mcp
        # govulncheck does call-graph analysis — it only flags CVEs
        # where the vulnerable function is actually reachable from the
        # binary's entrypoints.  False-positive rate is dramatically
        # lower than naive dep-version matching.
        run: govulncheck ./...
