name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/puck-security/puck-oss/blob/main/CLA.md'
          branch: 'main'
          allowlist: dependabot[bot],renovate[bot]
          create-file-commit-message: 'chore: create CLA signature file'
          signed-commit-message: 'docs(cla): $contributorName signed the CLA in #$pullRequestNo'
          custom-notsigned-prcomment: |
            Thanks for opening this PR!  Before we can merge it, you (or your employer) need to sign the [Puck Security CLA](https://github.com/puck-security/puck-oss/blob/main/CLA.md).

            **To sign**, please reply to this PR with the exact text:

            > I have read the CLA Document and I hereby sign the CLA

            You only need to do this once across all Puck repos.  If you've signed previously, comment `recheck` and the bot will re-verify.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All committers have signed the CLA.  Thanks!'
